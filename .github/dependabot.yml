version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Matches min-release-age=7 in .npmrc; newer versions would fail npm ci.
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # init, autobuild and analyze must share one version, or CodeQL fails.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
