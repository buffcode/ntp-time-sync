name: Publish NPM package

on:
  release:
    types: [released, prereleased]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Requires approval and only runs on release tags; npm trusts only this environment
    environment: npm-publish
    permissions:
      id-token: write  # Required for OIDC
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: '24'
          check-latest: true
          registry-url: 'https://registry.npmjs.org'
      - name: Install npm 12
        working-directory: ${{ runner.temp }}
        run: npm install -g npm@12.0.2
      - name: Install dependencies
        run: npm ci
      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" == *-* ]]; then
            echo "Prerelease detected ($VERSION) -> publishing with --tag next"
            npm publish --provenance --tag next
          else
            echo "Stable release ($VERSION) -> publishing with default tag (latest)"
            npm publish --provenance
          fi
