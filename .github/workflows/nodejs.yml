name: Node.js build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  # Dependencies are installed and built once with npm 12 (which enforces the
  # .npmrc policy: release-age cooldown, blocked install scripts). The runtime
  # test matrix and the Deno job consume that build output instead of
  # installing on their own.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: '24'
          check-latest: true
      - name: Install npm 12
        working-directory: ${{ runner.temp }}
        run: npm install -g npm@12.0.2
      - name: Install dependencies
        run: npm ci
      - name: Build (dual CJS + ESM)
        run: npm run build
      - name: Run unit tests
        run: npm run test:unit
      - name: Drop dev dependencies
        run: npm prune --omit=dev
      - name: Upload build output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build
          path: |
            dist/
            node_modules/
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        node-version: ['22', '24', '26']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: ${{ matrix.node-version }}
          check-latest: true
      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build
      - name: Run CJS integration test
        run: node test/integration/cjs.cjs
      - name: Run ESM integration test
        run: node test/integration/esm.mjs
      - name: Run examples
        run: node examples/example.js

  verify-package:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: '24'
          check-latest: true
      - name: Install npm 12
        working-directory: ${{ runner.temp }}
        run: npm install -g npm@12.0.2
      - name: Install dependencies
        run: npm ci
      - name: Verify published artifact (pack, publint, attw)
        run: npm run verify:package

  deno:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build
      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: Run Deno CJS integration test
        run: deno run --allow-read test/integration/deno.ts
      - name: Run Deno ESM integration test
        run: deno run --allow-read test/integration/deno-esm.ts
